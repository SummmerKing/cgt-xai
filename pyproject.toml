[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgt-xai"
version = "0.1.0"
description = "Cooperative game theory solution concepts for feature attribution and data valuation"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["cgt_xai*"]
